# Deploys the web app to GitHub Pages from a fresh build instead of the
# committed docs/ folder.
#
# To switch over: Settings → Pages → Source: "GitHub Actions", then change the
# trigger below to `push: branches: [main]`, delete docs/ from the repository
# (keep `docs/` as Vite's outDir — it just stops being committed, add it to
# .gitignore) and drop the "docs/ is up to date" step from ci.yml.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
