name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # Both end-to-end scripts build docs/ (the web app Electron loads) first.
      - name: Web end-to-end scenarios (Playwright)
        timeout-minutes: 8
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Desktop end-to-end scenarios (Electron under Xvfb)
        timeout-minutes: 5
        run: xvfb-run -a npm run test:e2e:electron
